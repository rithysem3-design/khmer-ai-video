name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download Khmer fonts (OFL)
        run: bash scripts/fetch_fonts.sh
      - name: Generate Android scaffolding
        run: |
          flutter create --platforms=android --org com.subtitleeditor --project-name subtitle_editor _scaffold
          cp -r _scaffold/android app/android
          python3 scripts/patch_manifest.py app/android/app/src/main/AndroidManifest.xml
      - name: Test and build
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Subtitle-Editor-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
